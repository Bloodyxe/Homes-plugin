name: HomesPlugin
version: '1.0.0'
main: de.dan.homes.HomesPlugin
api-version: '1.21'
author: dan
description: Personal home management with GUI, fully separated per player.

commands:
  sethome:
    description: Sets one of your homes at your current position.
    usage: /sethome <name>
    permission: homes.use
    permission-message: "&cYou don't have permission to do that."
  delhome:
    description: Deletes one of your homes.
    usage: /delhome <name>
    permission: homes.use
    permission-message: "&cYou don't have permission to do that."
  home:
    description: Teleports you directly to one of your homes by name.
    usage: /home <name>
    permission: homes.use
    permission-message: "&cYou don't have permission to do that."
  homes:
    description: Shows a GUI with all your homes, teleports you to a named home, or reloads the config with "reload".
    usage: /homes [name|reload]
    permission: homes.use
    permission-message: "&cYou don't have permission to do that."

permissions:
  homes.use:
    description: Allows using /sethome, /delhome, /home and /homes
    default: true
  homes.admin:
    description: Allows "/homes reload" to reload config.yml (not usable for accessing other players' homes)
    default: op
  homes.limit.wonder:
    description: >-
      Example permission for more homes (see config.yml, permission-limits).
      Assign it to the "wonder" rank via LuckPerms to give it a higher home limit.
    default: false
